name: Reproduce SQL and R analysis
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true
      - name: Run simulation, SQL, integrity tests, regression, and report
        run: python3 scripts/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: dfw-analysis-report
          path: reports/

